<ion-split-pane contentId="main-content" when="(min-width: 900px)">
  <ion-menu contentId="main-content" type="overlay">
    <ion-header>
      <ion-toolbar>
        <ion-title>Oficina</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <div class="user-block">
        <h4>{{ user()?.name || 'Utilizador' }}</h4>
        <p>{{ user()?.email }}</p>
      </div>
      <ion-list>
        <ion-item routerLink="/workshop/repairs" routerDirection="root">
          <ion-icon name="list-outline" slot="start"></ion-icon>
          <ion-label>Intervenções</ion-label>
        </ion-item>
        <ion-item routerLink="/workshop/new-intervention" routerDirection="forward">
          <ion-icon name="car-sport-outline" slot="start"></ion-icon>
          <ion-label>Nova intervenção</ion-label>
        </ion-item>
        <ion-item button (click)="logout()">
          <ion-icon name="log-out-outline" slot="start"></ion-icon>
          <ion-label>Logout</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>

  <div class="ion-page" id="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-menu-button></ion-menu-button>
        </ion-buttons>
        <ion-title>Auto RC Garage</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content [fullscreen]="false">
      <ion-router-outlet></ion-router-outlet>
    </ion-content>
  </div>
</ion-split-pane>
