<ion-split-pane contentId="main-content" when="(min-width: 900px)">
  <ion-menu contentId="main-content" type="overlay">
    <ion-header>
      <ion-toolbar>
        <ion-title>Oficina</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <div class="user-block">
        <h4>{{ user()?.name || 'Utilizador' }}</h4>
        <p>{{ user()?.email }}</p>
      </div>
      <ion-list>
        <ion-item routerLink="/workshop/repairs" routerDirection="root" (click)="closeMenu()">
          <ion-icon name="list-outline" slot="start"></ion-icon>
          <ion-label>Intervenções</ion-label>
        </ion-item>
        <ion-item routerLink="/workshop/planning" routerDirection="root" (click)="closeMenu()">
          <ion-icon name="calendar-outline" slot="start"></ion-icon>
          <ion-label>Planificação</ion-label>
        </ion-item>
        <ion-item routerLink="/workshop/garage-vehicles" routerDirection="root" (click)="closeMenu()">
          <ion-icon name="business-outline" slot="start"></ion-icon>
          <ion-label>Viaturas em oficina</ion-label>
        </ion-item>
        <ion-item *ngIf="canSeePartOrders()" routerLink="/workshop/part-orders" routerDirection="root" (click)="closeMenu()">
          <ion-icon name="cart-outline" slot="start"></ion-icon>
          <ion-label>Encomendas</ion-label>
        </ion-item>
        <ion-item routerLink="/workshop/new-intervention" routerDirection="forward" (click)="closeMenu()">
          <ion-icon name="car-sport-outline" slot="start"></ion-icon>
          <ion-label>Nova intervenção</ion-label>
        </ion-item>
        <ion-item button (click)="logout()">
          <ion-icon name="log-out-outline" slot="start"></ion-icon>
          <ion-label>Logout</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>

  <div class="ion-page" id="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-menu-button></ion-menu-button>
        </ion-buttons>
        <ion-title>Auto RC Garage</ion-title>
        <ion-buttons slot="end" *ngIf="checklistAlert.uncheckedCount() > 0">
          <ion-button class="checklist-alert-button" (click)="openChecklistAlert()">
            <ion-icon name="notifications-outline"></ion-icon>
            <ion-badge color="danger">{{ checklistAlert.uncheckedCount() }}</ion-badge>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content [fullscreen]="false">
      <ion-router-outlet></ion-router-outlet>
    </ion-content>
  </div>
</ion-split-pane>
